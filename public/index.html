<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer Atlas — degrade one layer, name the failure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="/styles.css">
<!-- pb-shell --><link rel="stylesheet" href="./pb-shell.css"><!-- pb-shell --><!-- pb-back --><link rel="stylesheet" href="./pb-back.css"><!-- pb-back --></head>
<body>
<header>
  <div class="masthead">
    <h1>Layer Atlas</h1>
    <p class="tagline">Same task. Same model. Three layers. Degrade one at a time
    and watch the failure carry the broken layer's signature.</p>
  </div>
  <nav><a href="/guide.html">How to read this lab →</a></nav>
</header>

<main>
  <section class="controls" aria-label="scenario controls">
    <div class="mode-picker" role="group" aria-label="fault mode">
      <button class="mode" data-scenario="healthy" type="button">
        <span class="mode-name">healthy</span>
        <span class="mode-sub">all three layers intact</span>
      </button>
      <button class="mode" data-scenario="restricted-harness" type="button">
        <span class="mode-name">restricted harness</span>
        <span class="mode-sub">tools removed · paths denied</span>
      </button>
      <button class="mode" data-scenario="broken-loop" type="button">
        <span class="mode-name">broken loop</span>
        <span class="mode-sub">observations never land</span>
      </button>
      <button class="mode" data-scenario="guarded-loop" type="button">
        <span class="mode-name">broken loop + guard</span>
        <span class="mode-sub">same break, stall detector on</span>
      </button>
      <button class="mode" data-scenario="racing-graph" type="button">
        <span class="mode-name">racing graph</span>
        <span class="mode-sub">flat shared state — last write wins</span>
      </button>
      <button class="mode" data-scenario="versioned-graph" type="button">
        <span class="mode-name">versioned graph</span>
        <span class="mode-sub">same race, compare-and-swap</span>
      </button>
    </div>
    <div class="actions">
      <button id="run" type="button">Run scenario</button>
      <button id="run-all" type="button">Run all six, side by side</button>
    </div>
  </section>

  <section id="results" aria-live="polite"></section>
</main>

<script type="module" src="/app.js"></script>
